services:
  - type: web
    name: skylark-bi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONDAY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: WORK_ORDERS_BOARD_ID
        sync: false
      - key: DEALS_BOARD_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://skylark-bi-frontend.onrender.com,https://skylark-opal.vercel.app
  - type: static
    name: skylark-bi-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://skylark-bi-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
