services:
  - type: web
    name: skylark-bi-backend
    env: python
    pythonVersion: "3.11.9"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONDAY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WORK_ORDERS_BOARD_ID
        sync: false
      - key: DEALS_BOARD_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
